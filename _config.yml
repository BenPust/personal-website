# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Countdowns
    description                           : Create countdowns. Give them a name, an end date and time, notification intervals, and a cool background.
    fontawesome_icon_name                 : grin-beam
    
  - title                                 : Import Calendar Events
    description                           : Import calendar events into the app and turn them into a countdown.
    fontawesome_icon_name                 : calendar-alt

  - title                                 : Custom Notifications
    description                           : Add notifications to your countdowns.
    fontawesome_icon_name                 : bell

  - title                                 : Custom Backgrounds
    description                           : Import an image from your photo library or pick a cool background from Unsplash.
    fontawesome_icon_name                 : images

  - title                                 : Widgets
    description                           : Keep countdowns on your home screen.
    fontawesome_icon_name                 : layer-group
  
  - title                                 : Share
    description                           : Clip small countdown cards from Upcoming and share them with anyone.
    fontawesome_icon_name                 : share

  - title                                 : Pinning
    description                           : Keep the most important countdowns at the top of your feed.
    fontawesome_icon_name                 : thumbtack

  - title                                 : Light & Dark Modes
    description                           : Easy on the eyes at night, clear to see during the day :)
    fontawesome_icon_name                 : adjust



